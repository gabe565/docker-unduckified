# Mirrors the caching and encoding rules upstream applies on Cloudflare Pages
# (public/_headers in taciturnaxolotl/unduckified).

# bangs.bin ships pre-compressed at brotli -11, which beats what a server
# compresses on the fly. Cloudflare serves that body to everyone; here it lives
# at bangs.bin.br (see the Dockerfile) next to a plain copy, so clients that do
# not ask for brotli still get something they can read.
map $http_accept_encoding $bangs_ext {
    default    "";
    "~*\bbr\b" ".br";
}

map $bangs_ext $bangs_encoding {
    default "";
    ".br"   "br";
}

# The OpenSearch descriptor hardcodes upstream's domain. Rewrite it to whichever
# host served it, so adding this instance as a browser search engine does not
# send every search to s.dunkirk.sh.
map $http_x_forwarded_proto $fwd_scheme {
    default $scheme;
    http    http;
    https   https;
}

# $host drops the port, which the descriptor needs when this is published on a
# nonstandard one, so prefer the raw Host header and keep $host as the fallback
# for the requests that carry none.
map $http_host $fwd_host {
    default $http_host;
    ""      $host;
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /bangs.bin {
        try_files  $uri$bangs_ext $uri =404;
        add_header Cache-Control "public, no-cache, no-transform";
        add_header Content-Encoding $bangs_encoding;
        gzip off;
    }

    location ~ ^/(sw|fallback)\.js$ {
        add_header Cache-Control "public, no-cache";
    }

    location = /opensearch.xml {
        sub_filter_types text/xml;
        sub_filter       "https://s.dunkirk.sh" "$fwd_scheme://$fwd_host";
        sub_filter_once  off;
        add_header       Cache-Control "public, no-cache";
    }

    location ~* \.(opus|svg|gif)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        add_header Cache-Control "public, no-cache";
    }

    location = /manifest.json {
        add_header Cache-Control "public, no-cache";
    }

    # Address-bar suggestions (OpenSearch) are a Cloudflare Pages Function
    # upstream, which has no equivalent here. Browsers issue those requests
    # outside any service worker, so they land on nginx, where 404 is a cleaner
    # answer than the SPA's HTML. Redirects never touch this path.
    location = /suggest {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
