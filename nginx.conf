worker_processes  auto;

error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;

    sendfile          on;
    #tcp_nopush        on;

    keepalive_timeout  65;

    #gzip  on;

    # bangs.bin ships pre-compressed at brotli -11, which beats what a server
    # compresses on the fly. Cloudflare serves that body to everyone; here it
    # lives at bangs.bin.br (see the Dockerfile) next to a plain copy, so clients
    # that do not ask for brotli still get something they can read.
    map $http_accept_encoding $bangs_ext {
        default    "";
        "~*\bbr\b" ".br";
    }

    map $bangs_ext $bangs_encoding {
        default "";
        ".br"   "br";
    }

    # The OpenSearch descriptor hardcodes upstream's domain. Rewrite it to
    # whichever host served it, so adding this instance as a browser search
    # engine does not send every search to s.dunkirk.sh.
    map $http_x_forwarded_proto $fwd_scheme {
        default $scheme;
        http    http;
        https   https;
    }

    # $host drops the port, which the descriptor needs when this is published on
    # a nonstandard one, so prefer the raw Host header and keep $host as the
    # fallback for the requests that carry none.
    map $http_host $fwd_host {
        default $http_host;
        ""      $host;
    }

    # The suggestion endpoint, run as a local Bun process.
    # Suggestions arrive one per keystroke, so hold connections open rather than
    # paying a handshake for each.
    upstream suggest {
        server 127.0.0.1:8081;
        keepalive 4;
    }

    server {
        listen       8080;
        listen       [::]:8080;
        server_name  localhost;

        root   /app/html;
        index  index.html;

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /bangs.bin {
            try_files  $uri$bangs_ext $uri =404;
            add_header Cache-Control "public, no-cache, no-transform";
            add_header Content-Encoding $bangs_encoding;
            gzip off;
        }

        location ~ ^/(sw|fallback)\.js$ {
            add_header Cache-Control "public, no-cache";
        }

        location = /opensearch.xml {
            sub_filter_types text/xml;
            sub_filter       "https://s.dunkirk.sh" "$fwd_scheme://$fwd_host";
            sub_filter_once  off;
            add_header       Cache-Control "public, no-cache";
        }

        location ~* \.(opus|svg|gif)$ {
            add_header Cache-Control "public, max-age=604800";
        }

        location = /index.html {
            add_header Cache-Control "public, no-cache";
        }

        location = /manifest.json {
            add_header Cache-Control "public, no-cache";
        }

        location = /suggest {
            proxy_pass         http://suggest;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout    5s;
            access_log off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
